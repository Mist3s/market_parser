[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mktlink"
version = "0.1.0"
description = "Название и продавец по ссылке на товар: Ozon, Wildberries, Яндекс.Маркет."
readme = "README.md"
requires-python = ">=3.12"

# Общее ядро: чистые модули плюс HTTP-путь запроса. Браузера здесь нет
# намеренно — см. extras ниже.
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  # curl_cffi, а не httpx: реплей Camoufox-jar требует подделки JA3/JA4 и
  # HTTP/2 SETTINGS, чего httpx не умеет вообще. Без этого тёплого пути нет.
  "curl_cffi>=0.7.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
# ЕДИНСТВЕННАЯ проверяемая в CI формулировка запрета браузера на пути
# запроса: в окружении `api` нет ни camoufox, ни playwright, поэтому браузер
# там не импортируется — потому что его там нет.
forge = [
  "camoufox>=0.4.11",
  # <1.49: версия обязана совпадать с базовым образом playwright, иначе
  # драйвер ищет chromium не той сборки; и не выше 1.4x — новые драйверы
  # несовместимы с camoufox 0.4.x.
  "playwright>=1.45.0,<1.49",
]
# Redis — ускоритель, а не источник истины, поэтому ОТДЕЛЬНАЯ экстра, а не
# основная зависимость. Без него кэш работает на памяти процесса и SQLite;
# см. mktlink/store/rediscache.py. Ни один тест его не требует.
redis = [
  "redis>=5.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[project.scripts]
mkt = "mktlink.cli:main"

[tool.setuptools.packages.find]
include = ["mktlink*"]

[tool.setuptools.package-data]
mktlink = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
