name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Full commit SHA of an existing image to roll back; empty builds current main'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-market-parser
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: [checks]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.tag != '' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_SHA}"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: inputs.tag == ''
      - uses: docker/login-action@v4
        if: inputs.tag == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: inputs.tag == ''
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mist3s/market_parser:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over restricted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          printf '%s:%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | ssh \
            -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $IMAGE_TAG"
