name: checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test without marketplace requests
        run: pytest -q
      - name: Check deployment scripts
        run: |
          for script in deploy/bootstrap deploy/mktlink-deploy; do bash -n "$script"; done
          shellcheck deploy/bootstrap deploy/mktlink-deploy
      - name: Build and smoke-test the API image
        run: |
          docker build --target api -t mktlink:test .
          python deploy/smoke.py mktlink:test
