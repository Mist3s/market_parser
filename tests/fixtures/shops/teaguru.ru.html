<!-- app: shop; template: html/product/microdata --><div class="b-microdata"><div itemscope itemtype="http://schema.org/Product"><meta itemprop="name" content="Да Хун Пао Нун Сян"><meta itemprop="description" content="&lt;p&gt;&lt;strong&gt;Да Хун Пао Нун Сян (Большой красный халат) &lt;/strong&gt;&amp;mdash; это сильно ферментированный улун, который входит в четвёрку знаменитых утёсных чаёв с гор Уи. Вместе с ним в этой группе находятся такие чаи, как Бай Цзы Гуань, Шуй Цзинь Гуй и Те Лохань.&lt;/p&gt;

&lt;p&gt;Слово «Нун Сян» означает длительную прожарку. Этот чай обладает ярким пряным ароматом и вкусом, а также красно-коричневым настоем. Вкус у него довольно крепкий и терпкий.&lt;br&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Характеристики чая:&lt;/strong&gt;&lt;br&gt;&lt;/p&gt;

&lt;ul&gt;

&lt;li&gt;&amp;nbsp;Аромат: тёплый, с нотками сухофруктов и дыма.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Настой: красно-коричневого цвета.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Вкус: мягкий, пряный, с лёгкими сливочными нотками и яркими черносливовыми оттенками. Послевкусие мягкое, сладкое, с нотками крем-брюле и цикория.&lt;/li&gt;

&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Эффект от чая:&lt;/strong&gt; улучшает настроение, подходит для отдыха и общения. Он гармонизирует состояние, может придать сил или расслабить &amp;mdash; в зависимости от потребностей. Этот вкусный чай можно пить как вечером, так и утром.&lt;br&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Польза улуна Да Хун Пао:&lt;/strong&gt;&lt;br&gt;&lt;/p&gt;

&lt;ol&gt;

&lt;li&gt;&amp;nbsp;Укрепляет сосуды и нормализует кровообращение.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Укрепляет дёсны и зубную эмаль.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Выводит из организма тяжёлые металлы, токсины и шлаки.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Абсорбирует жиры, помогая при похудении.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Имеет мочегонный эффект, выводит лишнюю жидкость из организма.&lt;/li&gt;

&lt;li&gt;&amp;nbsp;Замедляет процессы старения.&lt;/li&gt;

&lt;/ol&gt;

&lt;p&gt;&lt;strong&gt;Способ заваривания:&lt;br&gt;&lt;/strong&gt;&lt;/p&gt;

&lt;p&gt;Температура воды: 95 градусов.&lt;br&gt;&lt;/p&gt;

&lt;p&gt;Заваривание проливом (гун фу ча): на гайвань объёмом 150 мл &amp;mdash; столовая ложка. Чай выдерживает до 7 завариваний. Первые заварки лучше настаивать не более 40-50 секунд. Далее время заварки постепенно увеличивается.&lt;/p&gt;

&lt;p&gt;Обычный способ: на чайник объёмом 1 литр &amp;mdash; 1,5 столовые ложки, на чашку 200 мл &amp;mdash; 1 чайная ложка. Заварку можно использовать повторно, пока уровень воды не достигнет половины чайника или чашки.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Место произрастания:&lt;br&gt;&lt;/strong&gt;&lt;/p&gt;

&lt;p&gt;Уишань &amp;mdash; это горная цепь, расположенная на юго-востоке Китая. Она славится своим великолепием и чистейшим воздухом. Здесь произрастает 3728 видов растений и обитает 5110 видов животных.&lt;br&gt;&lt;/p&gt;

&lt;p&gt;Чай, который можно приобрести в нашем магазине, растёт примерно на высоте 600 метров над уровнем моря в красной вулканической почве, богатой отложениями и минералами. Такие чаи называются утёсными и высоко ценятся даосами.&lt;br&gt;&lt;/p&gt;"><meta itemprop="sku" content="3726"><div itemprop="aggregateRating" itemscope itemtype="http://schema.org/AggregateRating"><meta itemprop="ratingValue" content="5.00"><meta itemprop="reviewCount" content="2"></div><meta itemprop="image" content="https://teaguru.cdn.webasyst.cloud/wa-data/public/shop/products/32/14/1432/images/2606/2606.970.webp"><meta itemprop="weight" content="50 г"><div itemprop="offers" itemscope itemtype="http://schema.org/Offer"><meta itemprop="sku" content="3726"><meta itemprop="price" content="259"><meta itemprop="priceCurrency" content="RUB"><link itemprop="availability" href="http://schema.org/InStock"></div><div itemscope itemprop="review" itemtype="http://schema.org/Review"><meta itemprop="name" content="Не настаивать долго"><div itemprop="reviewRating" itemscope itemtype="http://schema.org/Rating"><meta itemprop="worstRating" content="1"><meta itemprop="ratingValue" content="5"><meta itemprop="bestRating" content="5"></div><div itemprop="author" itemscope itemtype="https://schema.org/Person"><meta itemprop="name" content="Самира"></div><meta itemprop="itemReviewed" content="Да Хун Пао Нун Сян"><meta itemprop="datePublished" content="2025-01-05"><meta itemprop="description" content="Прекрасный чай с мягким вкусом и легкой терпкостью. Важно не настаивать его слишком долго. Заказывала онлайн, думала что это обман, но все оказалось отлично!"></div><div itemscope itemprop="review" itemtype="http://schema.org/Review"><meta itemprop="name" content="Гораздо дешевле и вкусный "><div itemprop="reviewRating" itemscope itemtype="http://schema.org/Rating"><meta itemprop="worstRating" content="1"><meta itemprop="ratingValue" content="5"><meta itemprop="bestRating" content="5"></div><div itemprop="author
